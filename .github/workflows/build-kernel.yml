name: Build Kernel x64 (Debian 13 desktop)

on:
  workflow_dispatch: # 手动触发
    inputs:
      version:
        description: "Kernel version (e.g. 7.1.8)"
        required: true
        default: '7.1.8'
        type: string
      kernel_sign:
        description: 'LOCALVERSION 后缀(可留空, 影响 uname -r)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Download stable kernel source
        run: |
          V="${{ github.event.inputs.version }}"
          MAJOR="${V%%.*}"
          wget -q "https://cdn.kernel.org/pub/linux/kernel/v${MAJOR}.x/linux-${V}.tar.xz"
          tar -xf "linux-${V}.tar.xz"
          mv "linux-${V}" linux

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper bc bison flex \
            libssl-dev libelf-dev libdw-dev dwarves kmod cpio zstd lz4 \
            dpkg-dev fakeroot openssl

      - name: Configure kernel (Debian base + slim-desktop fragment)
        working-directory: linux
        run: |
          cp ../kernel-config/config-7.1.8+deb13-amd64 .config
          ./scripts/kconfig/merge_config.sh -m .config \
            ../kernel-config/slim-desktop.fragment
          # 保险: 清掉可能的发行版证书路径(vanilla 树不存在该文件会构建失败)
          ./scripts/config --set-str SYSTEM_TRUSTED_KEYS ""
          ./scripts/config --set-str SYSTEM_REVOCATION_KEYS ""
          make olddefconfig
          echo "== 精简项验证(以下应全部无输出) =="
          for sym in CONFIG_DEBUG_INFO= CONFIG_XEN= CONFIG_STAGING= \
                     CONFIG_MEDIA_PCI_SUPPORT= CONFIG_SND_SOC= \
                     CONFIG_INFINIBAND= CONFIG_GFS2_FS=; do
            if grep -q "^${sym}" .config; then echo "!! 未精简: ${sym}"; exit 1; fi
          done
          echo "CONFIG_EXT4_FS=$(grep '^CONFIG_EXT4_FS=' .config)"
          echo "CONFIG_USB_VIDEO_CLASS=$(grep '^CONFIG_USB_VIDEO_CLASS=' .config || echo m*未启用*)"

      - name: Apply kernel sign (写入 CONFIG_LOCALVERSION, 影响 uname -r)
        working-directory: linux
        run: |
          SIGN="${{ github.event.inputs.kernel_sign }}"
          ./scripts/config --disable CONFIG_LOCALVERSION_AUTO
          ./scripts/config --set-str CONFIG_LOCALVERSION "-${SIGN}"
          make olddefconfig
          echo "kernelrelease = $(make kernelrelease LOCALVERSION=)"

      - name: Build bzImage + modules + deb packages (bindeb-pkg)
        working-directory: linux
        run: |
          KVER=$(make kernelrelease LOCALVERSION=)
          echo "KVER=${KVER}" >> $GITHUB_ENV
          # DPKG_FLAGS=-d: 跳过 dpkg 构建依赖检查。
          # mkdebian 要求 debhelper-compat (= 12), Ubuntu noble 的 debhelper 13
          # 只 Provides (= 13), 该依赖 apt 永远无法满足, 只能 -d 绕过;
          # 实际构建依赖(debhelper/libdw-dev/bc/bison/flex...)已在上面装齐。
          make -j"$(nproc)" LOCALVERSION= bindeb-pkg \
            KDEB_PKGVERSION="${KVER}-1" DPKG_FLAGS="-d"
          ls -l ../*.deb

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp ../*linux-image*${{ env.KVER }}*deb out/ 2>/dev/null || cp ../*linux-image*.deb out/
          cp ../*linux-headers*${{ env.KVER }}*deb out/ 2>/dev/null || cp ../*linux-headers*.deb out/
          cp linux/.config "out/config-${{ env.KVER }}"
          ls -l out/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-x64
          files: |
            out/*
