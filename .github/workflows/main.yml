name: Build VPS x86_64 Kernel

on:
  workflow_dispatch: # 手动触发
    inputs:
      kernel_sign:
        description: '内核版本后缀(可留空,如 alice)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest # x86_64 原生 runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            dwarves kmod cpio zstd lz4

      - name: Configure kernel (x86_64_defconfig + kvm_guest + vps fragment)
        run: |
          make x86_64_defconfig kvm_guest.config
          ./scripts/kconfig/merge_config.sh -m .config kernel-config/amd64.fragment
          make ARCH=x86_64 olddefconfig

      - name: Apply kernel sign
        run: |
          SIGN="${{ github.event.inputs.kernel_sign }}"
          ./scripts/config --disable CONFIG_LOCALVERSION_AUTO
          if [ -n "$SIGN" ]; then
            ./scripts/config --set-str CONFIG_LOCALVERSION "-${SIGN}"
          fi
          make ARCH=x86_64 olddefconfig
          echo "kernelrelease = $(make ARCH=x86_64 kernelrelease LOCALVERSION=)"

      - name: Build bzImage / modules
        run: |
          make ARCH=x86_64 LOCALVERSION= -j$(nproc) bzImage

      - name: Package (tar.gz + deb)
        run: |
          KVER=$(make ARCH=x86_64 kernelrelease LOCALVERSION=)
          PKG="vps-kernel-${KVER}"

          # --- tar.gz ---
          mkdir -p "${PKG}/modules"
          cp arch/x86/boot/bzImage "${PKG}/"
          cp -r modules-out/lib/modules/"${KVER}" "${PKG}/modules/" || true
          cp .config "${PKG}/kernel.config"
          tar -czf "${PKG}.tar.gz" "${PKG}"

          # --- deb (linux-image 布局) ---
          DEB="linux-image-${KVER}"
          mkdir -p "${DEB}/DEBIAN" \
                   "${DEB}/boot" \
                   "${DEB}/lib/modules/${KVER}" \
                   "${DEB}/usr/share/doc/${DEB}"
          cp arch/x86/boot/bzImage "${DEB}/boot/vmlinuz-${KVER}"
          cp System.map            "${DEB}/boot/System.map-${KVER}"
          cp .config               "${DEB}/boot/config-${KVER}"
          cp -r modules-out/lib/modules/"${KVER}"* "${DEB}/lib/modules/${KVER}/" || true
          rm -f "${DEB}/lib/modules/${KVER}/build" "${DEB}/lib/modules/${KVER}/source"

          cat > "${DEB}/DEBIAN/control" << EOF
          Package: linux-image-${KVER}
          Version: ${KVER}
          Architecture: amd64
          Maintainer: 163jm <163jm@users.noreply.github.com>
          Depends:
          Provides: linux-image
          Section: kernel
          Priority: optional
          Description: KVM VPS kernel ${KVER} (mainline x86_64, virtio, tproxy/bbr ready)
          EOF

          cat > "${DEB}/DEBIAN/postinst" << EOF
          #!/bin/sh
          set -e
          depmod -a ${KVER} 2>/dev/null || true
          # grub 引导的机器:update-grub 会自动发现新内核
          if command -v update-grub >/dev/null 2>&1; then
              update-grub || true
          fi
          EOF
          chmod 755 "${DEB}/DEBIAN/postinst"

          dpkg-deb --root-owner-group --build "${DEB}" "${DEB}.deb"
          echo "PKG_TAR=${PKG}.tar.gz" >> $GITHUB_ENV
          echo "PKG_DEB=${DEB}.deb"   >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PKG_TAR }}
            ${{ env.PKG_DEB }}
          tag_name: vps-kernel-${{ github.run_number }}
          generate_release_notes: true
