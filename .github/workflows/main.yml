name: Build VPS x86_64 Kernel

on:
  workflow_dispatch: # 手动触发
    inputs:
      kernel_sign:
        description: '内核版本后缀(可留空,如 alice)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest # x86_64 原生 runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download stable kernel source (7.2.5, 与 amlogic-kernel 成功构建源一致)
        run: |
          KVER=7.2.5
          wget -q "https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-${KVER}.tar.xz"
          tar -xf "linux-${KVER}.tar.xz"
          mv "linux-${KVER}" linux

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev dwarves

      - name: Configure kernel (x86_64_defconfig + kvm_guest + amd64 fragment)
        working-directory: linux
        run: |
          make x86_64_defconfig kvm_guest.config
          ./scripts/kconfig/merge_config.sh -m .config ../kernel-config/amd64.fragment
          make ARCH=x86_64 olddefconfig

      - name: Apply kernel sign
        working-directory: linux
        run: |
          SIGN="${{ github.event.inputs.kernel_sign }}"
          ./scripts/config --disable CONFIG_LOCALVERSION_AUTO
          if [ -n "$SIGN" ]; then
            ./scripts/config --set-str CONFIG_LOCALVERSION "-${SIGN}"
          fi
          make ARCH=x86_64 olddefconfig
          echo "kernelrelease = $(make ARCH=x86_64 kernelrelease LOCALVERSION=)"

      - name: Build bzImage (全内建, MODULES=n, 无模块)
        working-directory: linux
        run: |
          make ARCH=x86_64 LOCALVERSION= -j$(nproc) bzImage

      - name: Package (tar.gz + deb)
        run: |
          KVER=$(cd linux && make ARCH=x86_64 kernelrelease LOCALVERSION=)
          PKG="vps-kernel-${KVER}"

          # --- tar.gz (全内建内核, 仅 bzImage + config) ---
          mkdir -p "${PKG}"
          cp linux/arch/x86/boot/bzImage "${PKG}/"
          cp linux/.config "${PKG}/kernel.config"
          tar -czf "${PKG}.tar.gz" "${PKG}"

          # --- deb (linux-image 布局) ---
          DEB="linux-image-${KVER}"
          mkdir -p "${DEB}/DEBIAN" \
                   "${DEB}/boot" \
                   "${DEB}/usr/share/doc/${DEB}"
          cp linux/arch/x86/boot/bzImage "${DEB}/boot/vmlinuz-${KVER}"
          cp linux/System.map            "${DEB}/boot/System.map-${KVER}"
          cp linux/.config               "${DEB}/boot/config-${KVER}"

          cat > "${DEB}/DEBIAN/control" << EOF
          Package: linux-image-${KVER}
          Version: ${KVER}
          Architecture: amd64
          Maintainer: 163jm <163jm@users.noreply.github.com>
          Depends:
          Provides: linux-image
          Section: kernel
          Priority: optional
          Description: KVM VPS kernel ${KVER} (mainline x86_64, virtio, tproxy/bbr ready)
          EOF

          cat > "${DEB}/DEBIAN/postinst" << EOF
          #!/bin/sh
          set -e
          # 全内建内核无模块, 无需 depmod
          # grub 引导的机器:update-grub 会自动发现新内核
          if command -v update-grub >/dev/null 2>&1; then
              update-grub || true
          fi
          EOF
          chmod 755 "${DEB}/DEBIAN/postinst"

          dpkg-deb --root-owner-group --build "${DEB}" "${DEB}.deb"
          echo "PKG_TAR=${PKG}.tar.gz" >> $GITHUB_ENV
          echo "PKG_DEB=${DEB}.deb"   >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-package
          path: |
            ${{ env.PKG_TAR }}
            ${{ env.PKG_DEB }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PKG_TAR }}
            ${{ env.PKG_DEB }}
          tag_name: vps-kernel-${{ github.run_number }}
          generate_release_notes: true
